

<!DOCTYPE html>
<html>
    <head>
        <title>MiniStream</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <header class="navbar">
    <div class="brand">
    <button type="button" id="menuButton" aria-label="Open menu" aria-expanded="false">
        &#9776;
    </button>

    <h1>MiniStream</h1>
    <nav id="dropdownMenu" hidden>
    <a href="/">Home</a>
    <a href="https://github.com/PinkThePanther/ministream"
       target="_blank" rel="noopener noreferrer">
        GitHub Repository
    </a>
</nav>
</div>

    <div class="upload-controls">
        <input type="file" id="videoFile" accept="video/mp4">
        <button type="button" id="uploadButton">Upload Video</button>
    </div>
</header>

<main class="video-container">
    <video id="videoPlayer" controls></video>
</main>
    <script>

    const menuButton = document.getElementById("menuButton");
    const dropdownMenu = document.getElementById("dropdownMenu");

menuButton.addEventListener("click", function() {
    dropdownMenu.hidden = !dropdownMenu.hidden;

    menuButton.setAttribute("aria-expanded", !dropdownMenu.hidden);
});


    const button = document.getElementById("uploadButton");
    const fileInput = document.getElementById("videoFile");

    button.addEventListener("click", async function() {
        const file = fileInput.files[0];

        if (!file) {
            alert("Please select a video first.");
            return;
        }

        try {
            const response = await fetch("/generate-upload-url", {
                method: "POST"
            });

            if (!response.ok) {
                throw new Error("Could not generate upload URL");
            }

            const data = await response.json();

            const uploadResponse = await fetch(data.upload_url, {
                method: "PUT",
                body: file
            });

            if (!uploadResponse.ok) {
                throw new Error("S3 upload failed");
            }

            const videoPlayer = document.getElementById("videoPlayer");

            videoPlayer.src = data.playback_url;
            alert("Video uploaded successfully!");
            

        } catch (error) {
            alert(error.message);
            console.error(error);
        }
    });
</script>

    </body>
</html>
